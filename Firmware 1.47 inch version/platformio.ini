[platformio]
default_envs = app

[env]
platform = ststm32
board = py32f030k28u6tr
framework =
monitor_speed = 115200
lib_archive = no
extra_scripts = post:scripts/export_artifacts.py
build_flags =
  -DPY32F030x8
  -DUSE_HAL_DRIVER
  -DFORBID_VECT_TAB_MIGRATION
  -DHSI_VALUE=24000000U
  -ffunction-sections
  -fdata-sections
  -Iinclude
  -Isrc/common
  -Ivendor/py32f0-template/Libraries/CMSIS/Core/Include
  -Ivendor/py32f0-template/Libraries/CMSIS/Device/PY32F0xx/Include
  -Ivendor/py32f0-template/Libraries/PY32F0xx_HAL_Driver/Inc
  -Wno-unused-parameter
  -Wno-missing-field-initializers
[env:bootloader]
build_flags =
  ${env.build_flags}
  -DBOOTLOADER
  -DUSER_VECT_TAB_OFFSET=0x0000
  -ffreestanding
  -nostdlib
  -nostartfiles
  -Wl,--gc-sections
board_build.ldscript = linker/bootloader.ld
build_src_filter =
  -<*>
  +<bootloader/>

[env:app]
build_flags =
  ${env.build_flags}
  -DAPPLICATION
  -DUSER_VECT_TAB_OFFSET=0x0800
  -Wl,--gc-sections
board_build.ldscript = linker/app.ld
build_src_filter =
  +<common/>
  +<app/>
  +<py32_vendor/>
  -<py32_vendor/py32f0xx_hal_rcc_ex.c>
  -<common/sw3562.c>
  -<common/ui.c>
  -<bootloader/>

[env:app_direct]
build_flags =
  ${env.build_flags}
  -DAPPLICATION
  -DUSER_VECT_TAB_OFFSET=0x0000
  -Wl,--gc-sections
board_build.ldscript = linker/app_direct.ld
build_src_filter =
  +<common/>
  +<app/>
  +<py32_vendor/>
  -<py32_vendor/py32f0xx_hal_rcc_ex.c>
  -<common/sw3562.c>
  -<common/ui.c>
  -<bootloader/>

[env:diag_lcd]
build_flags =
  ${env.build_flags}
  -DAPPLICATION
  -DUSER_VECT_TAB_OFFSET=0x0000
board_build.ldscript = linker/app_direct.ld
build_src_filter =
  -<*>
  +<diag/>
  +<common/board.c>
  +<common/st7735.c>
  +<common/syscalls.c>
  +<py32_vendor/>
  -<py32_vendor/py32f0xx_hal_rcc_ex.c>

[env:diag_gpio_lcd]
build_flags =
  ${env.build_flags}
  -DAPPLICATION
  -DUSER_VECT_TAB_OFFSET=0x0000
board_build.ldscript = linker/app_direct.ld
build_src_filter =
  -<*>
  +<diag_gpio_lcd/>
  +<common/board.c>
  +<common/st7735.c>
  +<common/syscalls.c>
  +<py32_vendor/>
  -<py32_vendor/py32f0xx_hal_rcc_ex.c>


